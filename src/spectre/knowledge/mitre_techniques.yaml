# mitre_techniques.yaml — canonical ATT&CK technique-id -> technique-name map.
# One entry per technique id (sub-technique ids included). Flat map, NOT keyed
# by rule. This is the source of truth for per-technique labels rendered in
# reports — never a rule's composite label (see mitre-map.yaml "label" field,
# which describes a whole RULE and may span multiple techniques).
