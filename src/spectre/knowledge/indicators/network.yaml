benign_infra_ip_cidrs:
  description: 'Known-CDN / legitimate-infrastructure IP ranges that should never
    trigger beacon/C2 alerts, expressed as real CIDR blocks and matched via
    proper IP-network containment (ipaddress module) — NOT string-prefix
    matching. A5 Finding 2 / A11 fix: the old benign_infra_ip_prefixes list
    used bare single/double-octet string prefixes ("13.", "20.", "40.",
    "52.", "104.") that each blanket-matched an entire /8 (16.7M addresses)
    under a `str.startswith()` check — only a fraction of which is actually
    the named provider. beacon() is the only caller (modules/pcap/rules.py
    _is_legitimate_ip); pcap-c2-protocol''s own T1090.004 (domain fronting)
    mapping exists precisely because C2 hides behind legitimate cloud/CDN
    infrastructure, so an over-broad allowlist here silently suppresses the
    exact threat the rule pack is supposed to catch.

    Generic multi-tenant hyperscale cloud ranges (the old "Microsoft Azure"
    entries: 13./20./40./52./104.) are DELIBERATELY NOT included here at
    any CIDR size: any customer, benign or malicious, can be assigned an
    address inside Azure''s public IP space, so no sub-block of it is
    "trusted infrastructure" in a way that is safe to blanket-skip for
    beacon detection. Only allowlist ranges that are the CDN/OS/AV
    vendor''s OWN static edge infrastructure, not resellable/assignable to
    arbitrary tenants — and keep them narrow. Refresh from an authoritative
    published feed (e.g. the provider''s own IP-range JSON) before relying
    on this list for a high-stakes suppression decision; it is a best-effort
    starting point, not a live intel feed.

    '
  values:
  - cidr: 23.32.0.0/11
    note: Akamai Technologies edge network (ARIN-registered block)
  - cidr: 23.192.0.0/11
    note: Akamai Technologies edge network (ARIN-registered block)
  - cidr: 150.171.0.0/16
    note: Microsoft first-party service range
  - cidr: 142.250.0.0/15
    note: Google first-party service range
  - cidr: 172.217.0.0/16
    note: Google first-party service range
c2_checkin_hosts:
  description: 'External IP/geo-lookup services abused by malware to check network
    connectivity and self-locate before beaconing to the real C2. A Host header
    match is a moderate-confidence signal, not a confirmed C2.

    '
  values:
  - api.ipify.org
  - ipinfo.io
  - ifconfig.me
  - icanhazip.com
benign_infra_domains:
  description: 'CRL/OCSP and other certificate-validation infrastructure hosts.
    Windows/browsers query these automatically for revocation checks — never a
    C2 indicator even when the query pattern looks suspicious (e.g. random-looking
    subdomains). dns_anomaly returns None on an equal/suffix match.

    '
