suspicious_ports:
  description: Ports frequently used by Metasploit / Cobalt Strike / reverse shells.
  values:
  # 27017 (MongoDB) intentionally NOT here — an exposed database service is
  # detected by pcap-exposed-service (T1133), not framed as offensive-tooling
  # C2 (T1571). See exposed_service_ports below.
  - '4444'
  - '4445'
  - '1337'
  - '31337'
  - '5555'
  - '6666'
  - '12345'
exposed_service_ports:
  description: 'Database/cache/search service ports that should never be directly
    reachable from outside — an inbound connection from a remote host to one of
    these on the monitored host is an EXPOSED LISTENING SERVICE (T1133), a
    distinct risk class from suspicious_ports (offensive-tooling C2 ports).
    Case 003: MongoDB on 27017 with no auth, reachable from the internet.

    '
  values:
  - '27017'  # MongoDB
  - '27018'  # MongoDB shard
  - '9200'   # Elasticsearch REST API
  - '9300'   # Elasticsearch transport
  - '6379'   # Redis
  - '5432'   # PostgreSQL
  - '3306'   # MySQL/MariaDB
  - '5984'   # CouchDB
  - '11211'  # Memcached
  - '2379'   # etcd client
  - '9042'   # Cassandra
c2_user_agents:
  description: 'User-Agent strings or substrings that identify known RATs, C2 frameworks,
    and suspicious HTTP clients. Matched case-insensitively against HTTP User-Agent
    headers. Sources: malware analysis reports, threat intel.

    '
  values:
  - NetSupport Manager
  - NetSupport Gateway
  - Cobalt Strike
  - Metasploit
  - Mozilla/5.0 zgrab
  - libredtail-http
  - xfa1
  - (KHTML like Gecko)
  - Hello from Palo Alto Networks
c2_server_headers:
  description: 'HTTP Server response headers that identify C2 infrastructure or suspicious
    services. Matched case-insensitively. Legitimate NetSupport Gateway is rare on
    internet-facing servers — flag it.

    '
  values:
  - NetSupport Gateway
  - Cobalt Strike
  - Metasploit
